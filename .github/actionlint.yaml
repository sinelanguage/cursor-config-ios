# actionlint configuration
# https://github.com/rhysd/actionlint/blob/main/docs/config.md

# These secrets need to be configured in GitHub repository settings:
# - APP_STORE_CONNECT_API_KEY_ID: App Store Connect API key identifier
# - APP_STORE_CONNECT_API_ISSUER_ID: App Store Connect issuer identifier
# - APP_STORE_CONNECT_API_KEY: Base64 or PEM-formatted App Store Connect private key
# - MATCH_PASSWORD: Fastlane match repository password

# Suppress expression warnings for known secrets that will be configured in GitHub
ignore:
  - 'Context access might be invalid: (APP_STORE_CONNECT_API_KEY_ID|APP_STORE_CONNECT_API_ISSUER_ID|APP_STORE_CONNECT_API_KEY|MATCH_PASSWORD)'
