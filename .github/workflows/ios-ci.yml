name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      # Replace with the Xcode app path installed on your runner when pinning a toolchain
      XCODE_PATH: /Applications/Xcode.app
      # Replace with your app scheme and simulator
      SCHEME: YourApp
      DESTINATION: "platform=iOS Simulator,OS=latest,name=iPhone 16"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build and test
        run: |
          xcodebuild \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            test
