name: SwiftLint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: swift-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat
      - name: Run SwiftLint
        run: |
          config_file=".swiftlint.yml"
          if [ ! -f "$config_file" ] && [ -f "templates/.swiftlint.yml" ]; then
            config_file="templates/.swiftlint.yml"
          fi
          swiftlint lint --config "$config_file"
      - name: Run SwiftFormat
        run: |
          config_file=".swiftformat"
          if [ ! -f "$config_file" ] && [ -f "templates/.swiftformat" ]; then
            config_file="templates/.swiftformat"
          fi
          swiftformat --lint . --config "$config_file"
